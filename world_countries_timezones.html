  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --badge-bg: #0284c7;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.65rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .table-container {
      overflow-x: auto;
      max-height: 75vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    thead {
      position: sticky;
      top: 0;
      background-color: #172033;
      z-index: 2;
    }

    th {
      padding: 0.85rem 1rem;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:hover td {
      background-color: var(--surface-hover);
    }

    .code-badge {
      display: inline-block;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--accent);
    }

    .utc-badge {
      display: inline-block;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: #0369a1;
      color: #fff;
      font-weight: 600;
      margin-right: 0.25rem;
    }

    .iana-tag {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .clock {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #38bdf8;
    }

    .counter {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>

      { name: "Zimbabwe", code: "ZW", utc: "UTC+02:00", iana: "Africa/Harare" }
    ];

    const tableBody = document.getElementById("countryTableBody");
    const searchInput = document.getElementById("searchInput");
    const recordCount = document.getElementById("recordCount");

    function renderTable(filterText = "") {
      const q = filterText.trim().toLowerCase();
      const filtered = dataset.filter(item => 
        item.name.toLowerCase().includes(q) ||
        item.code.toLowerCase().includes(q) ||
        item.utc.toLowerCase().includes(q) ||
        item.iana.toLowerCase().includes(q)
      );

      tableBody.innerHTML = filtered.map(row => `
        <tr>
          <td><strong>${row.name}</strong></td>
          <td><span class="code-badge">${row.code}</span></td>
          <td><span class="utc-badge">${row.utc}</span></td>
          <td class="iana-tag">${row.iana}</td>
          <td><span class="clock" data-zone="${row.iana}">--:--:--</span></td>
        </tr>
      `).join("");

      recordCount.textContent = `Showing ${filtered.length} of ${dataset.length} countries`;
      updateClocks();
    }

    function updateClocks() {
      const now = new Date();
      document.querySelectorAll(".clock").forEach(el => {
        const timeZone = el.getAttribute("data-zone");
        try {
          el.textContent = new Intl.DateTimeFormat("en-US", {
            timeZone: timeZone,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
          }).format(now);
        } catch (e) {
          el.textContent = "N/A";
        }
      });
    }

    searchInput.addEventListener("input", (e) => renderTable(e.target.value));

    document.getElementById("exportBtn").addEventListener("click", () => {
      const csvContent = "data:text/csv;charset=utf-8," + 
        ["Country,ISO Code,UTC Offset,Primary IANA Timezone"]
        .concat(dataset.map(d => `"${d.name}","${d.code}","${d.utc}","${d.iana}"`))
        .join("\n");
      
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "countries_timezones.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    renderTable();
    setInterval(updateClocks, 1000);
  </script>
</body>
